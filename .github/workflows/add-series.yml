# ============================================================
# Add a show or an anime without a terminal.
#
# Actions tab -> "Add a series" -> Run workflow -> type a name
# or a TMDB id, pick the vault, Run. It fetches the episode data,
# commits it, and the Deploy workflow publishes the result.
# ============================================================
name: Add a series

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Name, or a TMDB id (e.g. "severance" or 95396)'
        required: true
        type: string
      vault:
        description: Which vault it belongs in
        required: true
        default: show
        type: choice
        options: [show, anime]

# The job commits back to the repo, so it needs write access.
permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch and register
        run: npm run series -- add "${{ inputs.title }}" -- --kind "${{ inputs.vault }}"

      - name: Rebuild
        run: npm run build

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Nothing to do if the series was already there.
          if git diff --staged --quiet; then
            echo "No changes — it was probably already in the vault."
            exit 0
          fi
          git commit -m "Add ${{ inputs.title }} to the ${{ inputs.vault }} vault"
          git push
