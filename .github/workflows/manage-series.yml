# ============================================================
# Remove a series, or merge one into another — again without a
# terminal. Same pattern as adding: it edits the data, rebuilds,
# and commits, which triggers a deploy.
# ============================================================
name: Manage series

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: remove
        type: choice
        options: [remove, merge]
      target:
        description: 'The series id to remove, or the PARENT id when merging'
        required: true
        type: string
      child:
        description: 'Merging only: the id to fold into the parent'
        required: false
        type: string

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply
        run: |
          if [ "${{ inputs.action }}" = "merge" ]; then
            if [ -z "${{ inputs.child }}" ]; then
              echo "::error::Merging needs a child id as well as the parent."
              exit 1
            fi
            npm run series -- merge "${{ inputs.target }}" "${{ inputs.child }}"
          else
            npm run series -- remove "${{ inputs.target }}"
          fi

      - name: Rebuild
        run: npm run build

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "${{ inputs.action }}: ${{ inputs.target }} ${{ inputs.child }}"
          git push
