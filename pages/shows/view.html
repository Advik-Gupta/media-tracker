<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="../../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <style>@view-transition { navigation: auto; }</style>
    <meta name="theme-color" content="#121110" />
    <script>
      (function () {
        var t = "system";
        try { t = localStorage.getItem("mediavault.theme") || "system"; } catch (e) {}
        var light = t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.documentElement.dataset.themePref = t;
      })();
      (function () {
        var p = location.pathname;
        var here = /\/pages\/shows(\/|\.html)/.test(p) ? 1 : /\/pages\/anime(\/|\.html)/.test(p) ? 2 : 0;
        if (/\/pages\/(account|analytics|sharelist)\.html/.test(p)) return;
        var was = null;
        try {
          was = sessionStorage.getItem("mv.lib");
          sessionStorage.setItem("mv.lib", String(here));
        } catch (e) {}
        if (was !== null && Number(was) !== here)
          document.documentElement.dataset.nav = here > Number(was) ? "forward" : "back";
        document.documentElement.dataset.lib = ["movie", "show", "anime"][here];
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;450;500;600;650;700&family=Agdasima:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/img/pwa/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Media Vault" />
    <link rel="stylesheet" href="assets/css/libraries.css?v=1723bbfb" />

    <title>Loading - Media Vault</title>
    <meta
      name="description"
      content="Every season and episode, with ratings."
    />
    <link rel="stylesheet" href="assets/css/base.css?v=e64651e1" />
    <link rel="stylesheet" href="assets/css/universes.css?v=51372fb5" />
    <link rel="stylesheet" href="assets/css/tracker.css?v=ae928430" />
    <link rel="stylesheet" href="assets/css/series.css?v=7b4ac3be" />
    <link rel="icon" href="assets/img/brand/logo.svg" type="image/svg+xml" />
  </head>
  <body data-mode="show" data-universe="" class="u-view">
    <div class="page">
      <header class="topbar">
        <div class="wrap topbar-inner">
          <a class="brand" href="pages/shows.html">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke-width="3.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 25V7l10 12.5L26 7v18" stroke="currentColor"/><path d="M6 7l10 12.5L26 7" stroke="var(--accent)"/></svg>
            <span>Media Vault</span>
          </a>
          <span class="crumb" id="viewCrumb">/ Loading…</span>
          <span class="topbar-spacer"></span>
          <span id="acctChip"></span>
          <button
            class="btn btn-ghost"
            id="viewRefresh"
            title="Fetch the latest episode data"
          >
            Refresh
          </button>
          <button
            class="btn btn-ghost"
            id="jumpNext"
            title="Jump to the next unwatched episode"
          >
            Next up ↓
          </button>
        </div>
      </header>

      <section class="hero wrap">
        <p class="eyebrow reveal" id="viewEyebrow">&nbsp;</p>
        <h1 class="reveal" style="--d: 60ms" id="viewTitle">Loading…</h1>
        <p class="lede reveal" style="--d: 130ms" id="viewLede"></p>
      </section>

      <div class="controls">
        <div class="progress-rail"><i id="progressRail"></i></div>
        <div class="wrap ctrl-summary">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle class="ring-bg" cx="22" cy="22" r="19" />
              <circle class="ring-fg" cx="22" cy="22" r="19" id="ringFg" />
            </svg>
            <span class="ring-label" id="ringLabel">0%</span>
          </div>
          <div class="summary-figures">
            <div class="figure">
              <b id="figWatched">0</b><span>watched</span>
            </div>
            <div class="figure">
              <b id="figTotal">0</b><span>episodes</span>
            </div>
            <div class="figure">
              <b id="figLeft">0</b><span>remaining</span>
            </div>
            <div class="figure">
              <b id="figTime">0h</b><span>left to watch</span>
            </div>
          </div>
          <span class="topbar-spacer"></span>
          <div class="ctrl-buttons">
            <button class="btn btn-ghost" id="markOngoing" aria-pressed="false">
              Mark ongoing
            </button>
            <div class="ctrl-menu">
              <button class="btn btn-ghost" id="viewMenuBtn" aria-haspopup="true" aria-expanded="false">View <span aria-hidden="true">▾</span></button>
              <div class="ctrl-menu-panel" id="viewMenuPanel" hidden>
                <button type="button" class="switch" id="absNum" role="switch" aria-checked="false" hidden title="Number episodes 1 to the end and show them as one list, ignoring seasons"><span class="switch-track"><span class="switch-knob"></span></span><span>Continuous episodes</span></button>
                <button type="button" class="switch on" id="arcsView" role="switch" aria-checked="true" hidden title="Show arc lines in the episode list"><span class="switch-track"><span class="switch-knob"></span></span><span>Arc lines</span></button>
                <button class="btn btn-ghost" id="hideWatched" aria-pressed="false">Hide watched</button>
                <button class="btn btn-ghost" id="denseView" aria-pressed="false" title="Ratings only">Compact tiles</button>
                <button class="btn btn-ghost" id="collapseAll">Collapse all</button>
              </div>
            </div>
            <button class="btn btn-ghost" id="editPage" hidden>Edit page</button>
            <button class="btn btn-ghost danger" id="resetShow">Reset</button>
          </div>
        </div>
      </div>

      <main class="wrap series-wrap">
        <p class="rating-key reveal">
          <i class="r-cinema">Absolute Cinema</i>
          <i class="r-awesome">Awesome</i>
          <i class="r-great">Great</i>
          <i class="r-good">Good</i>
          <i class="r-average">Average</i>
          <i class="r-bad">Bad</i>
          <i class="r-garbage">Garbage</i>
        </p>
        <div id="viewStatus" class="view-status">
          <i class="spinner"></i>Fetching episodes…
        </div>
        <div id="seriesRoot"></div>
      </main>

      <footer class="footer">
        <div class="wrap footer-inner">
          <a class="foot-link" href="pages/analytics.html">Analytics</a>
          <span>Fetched live · progress stored in this browser</span>
          <span><a href="pages/shows.html">← All shows</a></span>
        </div>
      </footer>
    </div>

    <script src="assets/js/config.js?v=76725673"></script>
    <script src="assets/js/store.js?v=f7b0d8d2"></script>
    <script src="assets/js/cloud.js?v=86fc6f90"></script>
    <script src="assets/js/data/merges.js?v=cecf1ad9"></script>

    <script src="assets/js/modes.js?v=cf73c97d"></script>
    <script src="assets/js/data/series/_counts.js?v=82fe4d27"></script>
    <script src="assets/js/uservault.js?v=b0e1b08c"></script>
    <script src="assets/js/arcs.js?v=95dac1e6"></script>
    <link rel="preload" as="script" id="seriesSrc" href="assets/js/series.js?v=60415744" />
    <link rel="preload" as="script" id="pageEditSrc" href="assets/js/pageedit.js?v=7b76f612" />
    <script src="assets/js/ratingraph.js?v=5378304f"></script>
    <script src="assets/js/omdb.js?v=3461ca33"></script>
    <script src="assets/js/seriesview.js?v=8def3e63"></script>
    <script src="assets/js/account.js?v=8a75cf76"></script>
  </body>
</html>
