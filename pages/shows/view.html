<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="../../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading - Media Vault</title>
    <meta
      name="description"
      content="Every season and episode, with ratings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;450;500;600;650;700&family=Agdasima:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css?v=bc2f6f37" />
    <link rel="stylesheet" href="assets/css/universes.css?v=13b73a71" />
    <link rel="stylesheet" href="assets/css/tracker.css?v=75527f8d" />
    <link rel="stylesheet" href="assets/css/series.css?v=9e1a2001" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236a9ee8'/%3E%3C/svg%3E"
    />
  </head>
  <body data-mode="show" data-universe="" class="u-view">
    <div class="page">
      <header class="topbar">
        <div class="wrap topbar-inner">
          <a class="brand" href="pages/shows.html">
            <span class="brand-mark">MV</span>
            <span>Media Vault</span>
          </a>
          <span class="crumb" id="viewCrumb">/ Loading…</span>
          <span class="topbar-spacer"></span>
          <span id="acctChip"></span>
          <button
            class="btn btn-ghost"
            id="viewRefresh"
            title="Fetch the latest episode data"
          >
            Refresh
          </button>
          <button
            class="btn btn-ghost"
            id="jumpNext"
            title="Jump to the next unwatched episode"
          >
            Next up ↓
          </button>
        </div>
      </header>

      <section class="hero wrap">
        <p class="eyebrow reveal" id="viewEyebrow">&nbsp;</p>
        <h1 class="reveal" style="--d: 60ms" id="viewTitle">Loading…</h1>
        <p class="lede reveal" style="--d: 130ms" id="viewLede"></p>
      </section>

      <div class="controls">
        <div class="progress-rail"><i id="progressRail"></i></div>
        <div class="wrap ctrl-summary">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle class="ring-bg" cx="22" cy="22" r="19" />
              <circle class="ring-fg" cx="22" cy="22" r="19" id="ringFg" />
            </svg>
            <span class="ring-label" id="ringLabel">0%</span>
          </div>
          <div class="summary-figures">
            <div class="figure">
              <b id="figWatched">0</b><span>watched</span>
            </div>
            <div class="figure">
              <b id="figTotal">0</b><span>episodes</span>
            </div>
            <div class="figure">
              <b id="figLeft">0</b><span>remaining</span>
            </div>
            <div class="figure">
              <b id="figTime">0h</b><span>left to watch</span>
            </div>
          </div>
          <span class="topbar-spacer"></span>
          <div class="ctrl-buttons">
            <button class="btn btn-ghost" id="markOngoing" aria-pressed="false">
              Mark ongoing
            </button>
            <button class="btn btn-ghost" id="hideWatched" aria-pressed="false">
              Hide watched
            </button>
            <button
              class="btn btn-ghost"
              id="denseView"
              aria-pressed="false"
              title="Ratings only"
            >
              Compact
            </button>
            <button class="btn btn-ghost" id="collapseAll">Collapse all</button>
            <button class="btn btn-ghost danger" id="resetShow">Reset</button>
          </div>
        </div>
      </div>

      <main class="wrap series-wrap">
        <p class="rating-key reveal">
          <i class="r-cinema">Absolute Cinema</i>
          <i class="r-awesome">Awesome</i>
          <i class="r-great">Great</i>
          <i class="r-good">Good</i>
          <i class="r-average">Average</i>
          <i class="r-bad">Bad</i>
          <i class="r-garbage">Garbage</i>
        </p>
        <div id="viewStatus" class="view-status">
          <i class="spinner"></i>Fetching episodes…
        </div>
        <div id="seriesRoot"></div>
      </main>

      <footer class="footer">
        <div class="wrap footer-inner">
          <a class="foot-link" href="pages/analytics.html">📊 Analytics</a>
          <span>Fetched live · progress stored in this browser</span>
          <span><a href="pages/shows.html">← All shows</a></span>
        </div>
      </footer>
    </div>

    <script src="assets/js/config.js?v=76725673"></script>
    <script src="assets/js/store.js?v=0b55d48d"></script>
    <script src="assets/js/cloud.js?v=226ed1d5"></script>
    <script src="assets/js/data/merges.js?v=cecf1ad9"></script>
    <script src="assets/js/lightbox.js?v=d5f48017"></script>
    <script src="assets/js/data/_films.js?v=9501099f"></script>
    <script src="assets/js/modes.js?v=8e3ed557"></script>
    <script src="assets/js/data/series/_counts.js?v=828dcfab"></script>
    <script src="assets/js/uservault.js?v=78f6ec9d"></script>
    <!-- Fetches the show, then loads series.js once the data is in place. -->
    <script src="assets/js/seriesview.js?v=bdebc744"></script>
    <script src="assets/js/account.js?v=8a75cf76"></script>
  </body>
</html>
